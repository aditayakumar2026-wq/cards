<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Review & Social Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center">
    
    <!-- Shop Logo -->
    <div class="w-20 h-20 mx-auto rounded-full bg-slate-700 flex items-center justify-center border-2 border-amber-400 mb-4 shadow-lg overflow-hidden">
      <img id="shop-logo" src="https://via.placeholder.com/150" alt="Logo" class="w-full h-full object-cover">
    </div>

    <!-- Shop Name & Tagline -->
    <h1 id="shop-name" class="text-2xl font-bold tracking-tight text-white mb-1">Smart Shop</h1>
    <p id="shop-tagline" class="text-sm text-slate-400 mb-6">Connect with us</p>

    <!-- Buttons -->
    <div class="space-y-4">
      
      <!-- Google Review -->
      <a id="btn-review" href="#" target="_blank" class="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 shadow-lg font-semibold text-lg transition duration-200">
        <div class="flex items-center space-x-3">
          <i class="fa-brands fa-google text-2xl text-white"></i>
          <span>Google par 5★ Review dein</span>
        </div>
        <i class="fa-solid fa-chevron-right text-sm opacity-70"></i>
      </a>

      <!-- Instagram -->
      <a id="btn-insta" href="#" target="_blank" class="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 shadow-lg font-semibold text-lg transition duration-200">
        <div class="flex items-center space-x-3">
          <i class="fa-brands fa-instagram text-2xl text-white"></i>
          <span>Instagram par follow karein</span>
        </div>
        <i class="fa-solid fa-chevron-right text-sm opacity-70"></i>
      </a>

      <!-- YouTube -->
      <a id="btn-yt" href="#" target="_blank" class="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 shadow-lg font-semibold text-lg transition duration-200">
        <div class="flex items-center space-x-3">
          <i class="fa-brands fa-youtube text-2xl text-white"></i>
          <span>YouTube channel dekhein</span>
        </div>
        <i class="fa-solid fa-chevron-right text-sm opacity-70"></i>
      </a>

      <!-- WhatsApp -->
      <a id="btn-wa" href="#" target="_blank" class="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 shadow-lg font-semibold text-lg transition duration-200">
        <div class="flex items-center space-x-3">
          <i class="fa-brands fa-whatsapp text-2xl text-white"></i>
          <span>WhatsApp par baat karein</span>
        </div>
        <i class="fa-solid fa-chevron-right text-sm opacity-70"></i>
      </a>

    </div>

    <p class="text-xs text-slate-500 mt-8">Powered by Smart Tap NFC</p>
  </div>

  <script>
    // Dukaandar ki list (Yahan aap nayi dukaan add kar sakte hain)
    const allShops = {
      "shop1": {
        name: "Raj Deluxe Salon",
        tagline: "Hair & Skin Specialists",
        logo: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=150",
        reviewUrl: "https://g.page/r/your-google-review-link",
        instaUrl: "https://instagram.com",
        ytUrl: "https://youtube.com",
        waUrl: "https://wa.me/919876543210"
      },
      "shop2": {
        name: "Gupta Dental Clinic",
        tagline: "Smile with Confidence",
        logo: "https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=150",
        reviewUrl: "https://g.page/r/dental-review-link",
        instaUrl: "https://instagram.com",
        ytUrl: "https://youtube.com",
        waUrl: "https://wa.me/919876543210"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('id');

    if (shopId && allShops[shopId]) {
      const data = allShops[shopId];
      document.getElementById('shop-name').innerText = data.name;
      document.getElementById('shop-tagline').innerText = data.tagline;
      document.getElementById('shop-logo').src = data.logo;
      document.getElementById('btn-review').href = data.reviewUrl;
      document.getElementById('btn-insta').href = data.instaUrl;
      document.getElementById('btn-yt').href = data.ytUrl;
      document.getElementById('btn-wa').href = data.waUrl;
    } else {
      document.getElementById('shop-name').innerText = "Smart Tap Hub";
      document.getElementById('shop-tagline').innerText = "Kripya sahi QR scan karein";
    }
  </script>
</body>
</html>
